name: Publish PowerShell Modules

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-modules
  cancel-in-progress: false

env:
  MODULES: >-
    OMG.PSUtilities.Core,
    OMG.PSUtilities.ActiveDirectory,
    OMG.PSUtilities.AI,
    OMG.PSUtilities.AzureCore,
    OMG.PSUtilities.AzureDevOps,
    OMG.PSUtilities.ServiceNow,
    OMG.PSUtilities.VSphere,
    OMG.PSUtilities

jobs:
  publish:
    name: Validate, Package, and Publish
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure PowerShell Module Path
        shell: pwsh
        run: |
          "PSModulePath=$env:GITHUB_WORKSPACE;$env:PSModulePath" >> $env:GITHUB_ENV

      - name: Install Build Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.6.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -MinimumVersion 1.22.0 -Scope CurrentUser -Force
          Install-Module -Name ImportExcel -MinimumVersion 7.8.9 -Scope CurrentUser -Force
          Install-Module -Name Microsoft.PowerShell.ThreadJob -Scope CurrentUser -Force

      - name: Validate Repository
        shell: pwsh
        run: .\build\Test-Repository.ps1 -IncludeScriptAnalyzer

      - name: Run Pester Tests
        shell: pwsh
        run: |
          New-Item -Path '.\artifacts' -ItemType Directory -Force | Out-Null
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = '.\tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Normal'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = '.\artifacts\test-results.xml'
          $configuration.TestResult.OutputFormat = 'NUnitXml'
          Invoke-Pester -Configuration $configuration

      - name: Build Module Artifacts
        shell: pwsh
        run: .\build\Build-Modules.ps1 -Clean

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powershell-modules-${{ github.sha }}
          path: |
            artifacts/modules
            artifacts/test-results.xml
          retention-days: 90

      - name: Publish Updated Modules
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishedModules = [System.Collections.Generic.List[string]]::new()
          $modules = $env:MODULES -split ',' | ForEach-Object { $_.Trim() }

          foreach ($module in $modules) {
              $modulePath = Join-Path '.\artifacts\modules' $module
              $manifestPath = Join-Path $modulePath "$module.psd1"
              $manifest = Import-PowerShellDataFile -Path $manifestPath
              $localVersion = [version]$manifest.ModuleVersion
              $galleryVersion = [version]'0.0.0'

              try {
                  $galleryVersion = [version](Find-Module -Name $module -Repository PSGallery -ErrorAction Stop).Version
              } catch {
                  Write-Host "$module is not currently published."
              }

              if ($localVersion -le $galleryVersion) {
                  Write-Host "Skipping $module ($localVersion); gallery has $galleryVersion."
                  continue
              }

              if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
                  throw 'PSGALLERY_API_KEY is required to publish updated modules.'
              }

                if ($module -eq 'OMG.PSUtilities') {
                  foreach ($dependency in $manifest.RequiredModules) {
                    $dependencyName = $dependency.ModuleName
                    $minimumVersion = if ($dependency.RequiredVersion) {
                      [version]$dependency.RequiredVersion
                    } elseif ($dependency.ModuleVersion) {
                      [version]$dependency.ModuleVersion
                    } else {
                      [version]'0.0.0'
                    }

                    $dependencyAvailable = $false
                    foreach ($attempt in 1..18) {
                      try {
                        $publishedDependency = Find-Module -Name $dependencyName -Repository PSGallery -ErrorAction Stop
                        if ([version]$publishedDependency.Version -ge $minimumVersion) {
                          $dependencyAvailable = $true
                          break
                        }
                      } catch {
                        Write-Host "Waiting for $dependencyName $minimumVersion to become available."
                      }

                      Start-Sleep -Seconds 10
                    }

                    if (-not $dependencyAvailable) {
                      throw "Required module $dependencyName $minimumVersion is not available in PowerShell Gallery."
                    }
                  }
                }

              Write-Host "Publishing $module $localVersion (gallery: $galleryVersion)." -ForegroundColor Yellow
              Publish-Module -Path $modulePath -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -Force -ErrorAction Stop
              $publishedModules.Add("$module@$localVersion")
          }

          "PUBLISHED_MODULES=$($publishedModules -join ',')" >> $env:GITHUB_ENV

      - name: Tag Published Versions
        if: env.PUBLISHED_MODULES != ''
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          foreach ($publishedModule in ($env:PUBLISHED_MODULES -split ',')) {
              $name, $version = $publishedModule -split '@'
              $tag = "$name-v$version"
              if (-not (git tag --list $tag)) {
                  git tag -a $tag -m "Release $name $version"
              }
          }

          git push origin --tags

      - name: Write Release Summary
        if: always()
        shell: pwsh
        run: |
          "## PowerShell module release" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          if ($env:PUBLISHED_MODULES) {
              "Published: $env:PUBLISHED_MODULES" >> $env:GITHUB_STEP_SUMMARY
          } else {
              'No module versions required publishing.' >> $env:GITHUB_STEP_SUMMARY
          }
